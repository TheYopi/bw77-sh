# Generated by BW77-Shell. Edits are overwritten on the next theme apply.
#
# Two-tone powerline: a bright segment for the user, a dimmer one for the path,
# then a chevron in the accent colour on its own line.
#
# The foreground of each segment is chosen per palette rather than fixed. A
# static near-black is right on most themes and unreadable on the ones whose
# dim accent is already dark, so {{onAccent}} and {{onAccentDim}} resolve to
# whichever of the theme's two text colours actually reads on that background.
#
# The glyphs below need a Nerd Font. If you see boxes, the terminal font is not
# a patched build rather than anything being wrong with the colours.

add_newline = false

format = """
[ 󰣇 ](bg:{{accent}} fg:{{onAccent}})\
$username\
[](fg:{{accent}} bg:{{accentDim}})\
$directory\
[](fg:{{accentDim}} bg:{{termBg}})\
\n $character
"""

[os]
style = "bg:{{accent}}"
disabled = false
format = "  "

[username]
show_always = true
style_user = "fg:{{onAccent}} bg:{{accent}}"
style_root = "fg:{{onDanger}} bg:{{danger}}"
format = '[$user]($style)'

[directory]
style = "fg:{{onAccentDim}} bg:{{accentDim}}"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = ".../"

[character]
success_symbol = '[](bold fg:{{accent}})'
error_symbol = '[](bold fg:{{danger}})'
